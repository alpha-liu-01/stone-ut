# Top-level UCM file for this device (ALSA_CONFIG_UCM2 points here for
# PulseAudio). Only the built-in card has a profile; any other card (a USB
# headset) finds none and PulseAudio falls back to its normal probing.
Syntax 4

If.stone {
	Condition {
		Type String
		String1 "${CardId}"
		String2 "holiqrdsku1sndc"
	}
	True.UseCasePath.stone {
		Directory "stone"
		File "stone.conf"
	}
}
