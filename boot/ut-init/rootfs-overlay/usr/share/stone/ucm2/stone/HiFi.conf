# Routing for the holi-qrdsku1 card, transcribed from the vendor
# /vendor/etc/mixer_paths_qrdsku1.xml (the 32-bit audio HAL that would apply
# it cannot run here).
#
# PulseAudio turns each output device into a port of one sink and each input
# device into a port of one source ("[Out] Earpiece", "[In] Mic", ...).
# lomiri-telephony-service picks the port for a call (earpiece, speaker or
# Bluetooth, from the dialer's audio button) and PulseAudio runs the
# sequences below. Output devices carry the whole call route, like the
# vendor "voicemmode1-call <device>" + "<device>-mic" paths: the VoiceMMode1
# downlink, the uplink mic and media. stone-call-audio only starts the voice
# session while the modem has a call, see /usr/lib/stone/call-audio.sh.
#
# The capture decimator (TX_AIF1_CAP Mixer DEC0) is set by the verb and never
# cleared: without it MultiMedia1 capture cannot even be prepared.
#
# Uplink mic: one mic, mono (vendor amic1/amic3). Without the ACDB voice
# calibration the DSP runs no fluence/ECNS, so the dual-mic handset-mic path
# brings nothing. TX_DEC0 Volume is 1 dB/step, 84 = 0 dB; 104 = +20 dB
# replaces the uplink gain the calibration would add (item 5 of
# docs/roadmap-hardware.md: below +20 the vocoder's DTX chopped speech).

SectionVerb {
	EnableSequence [
		# PulseAudio probes (opens and prepares) both PCMs right after
		# setting the verb, before enabling any device. A back end only
		# prepares when its codec side is routed, otherwise the probe gets
		# -EINVAL and PulseAudio drops the whole card ("Failed to find a
		# working profile"):
		#   RX_CDC_DMA_RX_1 needs RX_MACRO RX2 MUX = AIF2_PB,
		#   TX_CDC_DMA_TX_3 needs a decimator on TX_AIF1_CAP.
		# So the verb sets up the speaker chain and one mic (amic1); the
		# devices below only switch what differs. This used to be done by
		# speaker-route.sh before PulseAudio started.
		cset "name='RX_MACRO RX2 MUX' AIF2_PB"
		cset "name='RX_CDC_DMA_RX_1 Channels' One"
		cset "name='RX INT2_1 MIX1 INP0' RX2"
		cset "name='RX INT2_1 INTERP' 'RX INT2_1 MIX1'"
		cset "name='AUX_RDAC Switch' 1"
		cset "name='SpkrLeft Sipa Audio Scene' Playback"
		cset "name='SpkrLeft Sipa Power' On"
		cset "name='RX_CDC_DMA_RX_1 Audio Mixer MultiMedia5' 1"
		cset "name='TX_CDC_DMA_TX_3 Channels' One"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC0"
		cset "name='ADC1 ChMap' SWRM_TX1_CH1"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='MultiMedia1 Mixer TX_CDC_DMA_TX_3' 1"
	]
	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker"
	ConflictingDevice [
		"Earpiece"
		"Bluetooth"
	]
	EnableSequence [
		# paths "speaker" + "low-latency-playback"
		cset "name='RX_MACRO RX2 MUX' AIF2_PB"
		cset "name='RX_CDC_DMA_RX_1 Channels' One"
		cset "name='RX INT2_1 MIX1 INP0' RX2"
		cset "name='RX INT2_1 INTERP' 'RX INT2_1 MIX1'"
		cset "name='AUX_RDAC Switch' 1"
		cset "name='SpkrLeft Sipa Audio Scene' Playback"
		cset "name='SpkrLeft Sipa Power' On"
		cset "name='RX_CDC_DMA_RX_1 Audio Mixer MultiMedia5' 1"
		# "voicemmode1-call" + speaker uplink mic (amic3, second mic)
		cset "name='RX_CDC_DMA_RX_1_Voice Mixer VoiceMMode1' 1"
		cset "name='TX_CDC_DMA_TX_3 Channels' One"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC4"
		cset "name='ADC2 ChMap' SWRM_TX2_CH1"
		cset "name='ADC2 MUX' INP3"
		cset "name='ADC2_MIXER Switch' 1"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_DEC0 Volume' 104"
		cset "name='VoiceMMode1_Tx Mixer TX_CDC_DMA_TX_3_MMode1' 1"
	]
	DisableSequence [
		cset "name='VoiceMMode1_Tx Mixer TX_CDC_DMA_TX_3_MMode1' 0"
		cset "name='TX_DEC0 Volume' 84"
		cset "name='ADC2_MIXER Switch' 0"
		cset "name='RX_CDC_DMA_RX_1_Voice Mixer VoiceMMode1' 0"
		cset "name='RX_CDC_DMA_RX_1 Audio Mixer MultiMedia5' 0"
	]
	Value {
		PlaybackPriority 300
		PlaybackPCM "stone_mm5"
		PlaybackChannels 2
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece"
	ConflictingDevice [
		"Speaker"
		"Bluetooth"
	]
	EnableSequence [
		# paths "handset" + "low-latency-playback handset"
		cset "name='RX_MACRO RX0 MUX' AIF1_PB"
		cset "name='RX_CDC_DMA_RX_0 Channels' One"
		cset "name='RX INT0_1 MIX1 INP0' RX0"
		cset "name='RX INT0 DEM MUX' CLSH_DSM_OUT"
		cset "name='EAR_RDAC Switch' 1"
		cset "name='RDAC3_MUX' RX1"
		cset "name='RX_EAR Mode' ON"
		cset "name='RX_CDC_DMA_RX_0 Audio Mixer MultiMedia5' 1"
		# "voicemmode1-call handset" + handset uplink mic (amic1, main mic)
		cset "name='RX_CDC_DMA_RX_0_Voice Mixer VoiceMMode1' 1"
		cset "name='TX_CDC_DMA_TX_3 Channels' One"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC0"
		cset "name='ADC1 ChMap' SWRM_TX1_CH1"
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_DEC0 Volume' 104"
		cset "name='VoiceMMode1_Tx Mixer TX_CDC_DMA_TX_3_MMode1' 1"
	]
	DisableSequence [
		cset "name='VoiceMMode1_Tx Mixer TX_CDC_DMA_TX_3_MMode1' 0"
		cset "name='TX_DEC0 Volume' 84"
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='RX_CDC_DMA_RX_0_Voice Mixer VoiceMMode1' 0"
		cset "name='RX_CDC_DMA_RX_0 Audio Mixer MultiMedia5' 0"
		cset "name='RX_EAR Mode' OFF"
		cset "name='EAR_RDAC Switch' 0"
	]
	Value {
		PlaybackPriority 100
		PlaybackPCM "stone_mm5"
		PlaybackChannels 2
	}
}

# Bluetooth SCO (HFP/HSP). The BT chip's SCO audio runs over SLIMbus
# (SLIMBUS_7, btfmslim), not over HCI. The SCO link itself is opened by
# PulseAudio's bluez module when sink.fake.sco/source.fake.sco are in use;
# stone-call-audio keeps source.fake.sco open while this port is active.
# 8 kHz: PulseAudio runs HFP with enable_msbc=false (CVSD narrowband).
SectionDevice."Bluetooth" {
	Comment "Bluetooth headset"
	ConflictingDevice [
		"Speaker"
		"Earpiece"
	]
	EnableSequence [
		cset "name='BT SampleRate' KHZ_8"
		cset "name='BT SampleRate RX' KHZ_8"
		cset "name='BT SampleRate TX' KHZ_8"
		# "low-latency-playback bt-sco" + "voicemmode1-call bt-sco"
		cset "name='SLIMBUS_7_RX Audio Mixer MultiMedia5' 1"
		cset "name='SLIM_7_RX_Voice Mixer VoiceMMode1' 1"
		cset "name='VoiceMMode1_Tx Mixer SLIM_7_TX_MMode1' 1"
	]
	DisableSequence [
		cset "name='VoiceMMode1_Tx Mixer SLIM_7_TX_MMode1' 0"
		cset "name='SLIM_7_RX_Voice Mixer VoiceMMode1' 0"
		cset "name='SLIMBUS_7_RX Audio Mixer MultiMedia5' 0"
	]
	Value {
		PlaybackPriority 50
		PlaybackPCM "stone_mm5"
		PlaybackChannels 2
	}
}

# Capture front end for recording apps (MultiMedia1). The mic chain itself
# is set by the active output device above.
SectionDevice."Mic" {
	Comment "Built-in microphone"
	ConflictingDevice [
		"BluetoothMic"
	]
	EnableSequence [
		cset "name='MultiMedia1 Mixer TX_CDC_DMA_TX_3' 1"
	]
	DisableSequence [
		cset "name='MultiMedia1 Mixer TX_CDC_DMA_TX_3' 0"
	]
	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},0"
		CaptureChannels 1
	}
}

SectionDevice."BluetoothMic" {
	Comment "Bluetooth headset microphone"
	ConflictingDevice [
		"Mic"
	]
	EnableSequence [
		cset "name='MultiMedia1 Mixer SLIM_7_TX' 1"
	]
	DisableSequence [
		cset "name='MultiMedia1 Mixer SLIM_7_TX' 0"
	]
	Value {
		CapturePriority 50
		CapturePCM "hw:${CardId},0"
		CaptureChannels 1
	}
}
