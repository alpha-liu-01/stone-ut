# Routing for the holi-qrdsku1 card, transcribed from the vendor
# /vendor/etc/mixer_paths_qrdsku1.xml (the 32-bit audio HAL that would apply
# it cannot run here).
#
# PulseAudio turns each output device into a port of one sink and each input
# device into a port of one source ("[Out] Earpiece", "[In] Mic", ...).
# lomiri-telephony-service picks the port for a call (earpiece, speaker,
# 3.5 mm headset or Bluetooth, from the dialer's audio button) and
# PulseAudio runs the sequences below. Output devices carry the whole call route, like the
# vendor "voicemmode1-call <device>" + "<device>-mic" paths: the VoiceMMode1
# downlink, the uplink mic and media. stone-call-audio only starts the voice
# session while the modem has a call, see /usr/lib/stone/call-audio.sh.
#
# The capture decimator (TX_AIF1_CAP Mixer DEC0) is set by the verb and never
# cleared: without it MultiMedia1 capture cannot even be prepared.
#
# Uplink mic: one mic, mono (vendor amic1/amic3). Without the ACDB voice
# calibration the DSP runs no fluence/ECNS, so the dual-mic handset-mic path
# brings nothing. TX_DEC0 Volume is 1 dB/step, 84 = 0 dB; 104 = +20 dB
# replaces the uplink gain the calibration would add (item 5 of
# docs/roadmap-hardware.md: below +20 the vocoder's DTX chopped speech).
#
# This file is the "Voice Call" verb (see stone.conf for the name).
#
# 3.5 mm jack: the codec's headset detection (WCD937x MBHC) reports the plug
# state on a separate ALSA card, "StoneJack" (kernel patch
# kernel/patches/0003-wcd-mbhc-jack-controls-on-own-card.patch), whose only
# controls are "Headphone Jack" and "Headset Mic Jack". PulseAudio watches
# them (JackCTL/JackControl below) to mark the Headphones/Headset ports
# available, switch to them on plug-in and back on unplug, and
# telephony-service routes calls to them. The main card cannot carry the
# jack controls: alsa-lib's mixer, which PulseAudio needs to watch them,
# fails to load it (about 100 vendor controls refuse to be read).
#
# Mic selection: the output device sets the call's uplink mic for the
# built-in mics; the Headset input device then switches the shared
# decimator (DEC0 -> TX_CDC_DMA_TX_3) to the headset mic. telephony-service
# and PulseAudio set the output port before the input port.

SectionVerb {
	EnableSequence [
		# PulseAudio probes (opens and prepares) both PCMs right after
		# setting the verb, before enabling any device. A back end only
		# prepares when its codec side is routed, otherwise the probe gets
		# -EINVAL and PulseAudio drops the whole card ("Failed to find a
		# working profile"):
		#   RX_CDC_DMA_RX_1 needs RX_MACRO RX2 MUX = AIF2_PB,
		#   TX_CDC_DMA_TX_3 needs a decimator on TX_AIF1_CAP.
		# So the verb sets up the speaker chain and one mic (amic1); the
		# devices below only switch what differs. This used to be done by
		# speaker-route.sh before PulseAudio started.
		cset "name='RX_MACRO RX2 MUX' AIF2_PB"
		cset "name='RX_CDC_DMA_RX_1 Channels' One"
		cset "name='RX INT2_1 MIX1 INP0' RX2"
		cset "name='RX INT2_1 INTERP' 'RX INT2_1 MIX1'"
		cset "name='AUX_RDAC Switch' 1"
		cset "name='SpkrLeft Sipa Audio Scene' Playback"
		cset "name='SpkrLeft Sipa Power' On"
		cset "name='RX_CDC_DMA_RX_1 Audio Mixer MultiMedia5' 1"
		cset "name='TX_CDC_DMA_TX_3 Channels' One"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC0"
		cset "name='ADC1 ChMap' SWRM_TX1_CH1"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='MultiMedia1 Mixer TX_CDC_DMA_TX_3' 1"
	]
	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker"
	ConflictingDevice [
		"Earpiece"
		"Headphones"
		"Bluetooth"
		"USB"
	]
	EnableSequence [
		# paths "speaker" + "low-latency-playback"
		cset "name='RX_MACRO RX2 MUX' AIF2_PB"
		cset "name='RX_CDC_DMA_RX_1 Channels' One"
		cset "name='RX INT2_1 MIX1 INP0' RX2"
		cset "name='RX INT2_1 INTERP' 'RX INT2_1 MIX1'"
		cset "name='AUX_RDAC Switch' 1"
		cset "name='SpkrLeft Sipa Audio Scene' Playback"
		cset "name='SpkrLeft Sipa Power' On"
		cset "name='RX_CDC_DMA_RX_1 Audio Mixer MultiMedia5' 1"
		# "voicemmode1-call" + speaker uplink mic (amic3, second mic)
		cset "name='RX_CDC_DMA_RX_1_Voice Mixer VoiceMMode1' 1"
		cset "name='TX_CDC_DMA_TX_3 Channels' One"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC4"
		cset "name='ADC2 ChMap' SWRM_TX2_CH1"
		cset "name='ADC2 MUX' INP3"
		cset "name='ADC2_MIXER Switch' 1"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_DEC0 Volume' 104"
		cset "name='VoiceMMode1_Tx Mixer TX_CDC_DMA_TX_3_MMode1' 1"
	]
	DisableSequence [
		cset "name='VoiceMMode1_Tx Mixer TX_CDC_DMA_TX_3_MMode1' 0"
		cset "name='TX_DEC0 Volume' 84"
		cset "name='ADC2_MIXER Switch' 0"
		cset "name='RX_CDC_DMA_RX_1_Voice Mixer VoiceMMode1' 0"
		cset "name='RX_CDC_DMA_RX_1 Audio Mixer MultiMedia5' 0"
	]
	Value {
		PlaybackPriority 300
		PlaybackPCM "stone_mm5"
		PlaybackChannels 2
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece"
	ConflictingDevice [
		"Speaker"
		"Headphones"
		"Bluetooth"
		"USB"
	]
	EnableSequence [
		# paths "handset" + "low-latency-playback handset"
		cset "name='RX_MACRO RX0 MUX' AIF1_PB"
		cset "name='RX_CDC_DMA_RX_0 Channels' One"
		cset "name='RX INT0_1 MIX1 INP0' RX0"
		cset "name='RX INT0 DEM MUX' CLSH_DSM_OUT"
		cset "name='EAR_RDAC Switch' 1"
		cset "name='RDAC3_MUX' RX1"
		cset "name='RX_EAR Mode' ON"
		cset "name='RX_CDC_DMA_RX_0 Audio Mixer MultiMedia5' 1"
		# "voicemmode1-call handset" + handset uplink mic (amic1, main mic)
		cset "name='RX_CDC_DMA_RX_0_Voice Mixer VoiceMMode1' 1"
		cset "name='TX_CDC_DMA_TX_3 Channels' One"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC0"
		cset "name='ADC1 ChMap' SWRM_TX1_CH1"
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_DEC0 Volume' 104"
		cset "name='VoiceMMode1_Tx Mixer TX_CDC_DMA_TX_3_MMode1' 1"
	]
	DisableSequence [
		cset "name='VoiceMMode1_Tx Mixer TX_CDC_DMA_TX_3_MMode1' 0"
		cset "name='TX_DEC0 Volume' 84"
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='RX_CDC_DMA_RX_0_Voice Mixer VoiceMMode1' 0"
		cset "name='RX_CDC_DMA_RX_0 Audio Mixer MultiMedia5' 0"
		cset "name='RX_EAR Mode' OFF"
		cset "name='EAR_RDAC Switch' 0"
	]
	Value {
		PlaybackPriority 100
		PlaybackPCM "stone_mm5"
		PlaybackChannels 2
	}
}

# 3.5 mm headphones or headset (stereo HPHL/HPHR). Available only while the
# jack reports headphones; highest priority, so PulseAudio switches media to
# it on plug-in.
SectionDevice."Headphones" {
	Comment "Headphones"
	ConflictingDevice [
		"Speaker"
		"Earpiece"
		"Bluetooth"
		"USB"
	]
	EnableSequence [
		# defaults the vendor HAL applies at boot (left at CLS_H_INVALID here)
		cset "name='RX HPH Mode' CLS_H_ULP"
		cset "name='RX_HPH_PWR_MODE' ULP"
		# paths "headphones" + "low-latency-playback headphones"
		cset "name='RX_MACRO RX0 MUX' AIF1_PB"
		cset "name='RX_MACRO RX1 MUX' AIF1_PB"
		cset "name='RX_CDC_DMA_RX_0 Channels' Two"
		cset "name='RX INT0_1 MIX1 INP0' RX0"
		cset "name='RX INT1_1 MIX1 INP0' RX1"
		cset "name='RX INT0 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX INT1 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX_COMP1 Switch' 1"
		cset "name='RX_COMP2 Switch' 1"
		cset "name='HPHL_COMP Switch' 1"
		cset "name='HPHR_COMP Switch' 1"
		cset "name='HPHL_RDAC Switch' 1"
		cset "name='HPHR_RDAC Switch' 1"
		cset "name='RX_CDC_DMA_RX_0 Audio Mixer MultiMedia5' 1"
		# "voicemmode1-call headphones": downlink to the headphones, uplink
		# from the main mic (amic1, as for the earpiece). With a 4-pole
		# headset the Headset input device moves the uplink to its mic.
		cset "name='RX_CDC_DMA_RX_0_Voice Mixer VoiceMMode1' 1"
		cset "name='TX_CDC_DMA_TX_3 Channels' One"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC0"
		cset "name='ADC1 ChMap' SWRM_TX1_CH1"
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_DEC0 Volume' 104"
		cset "name='VoiceMMode1_Tx Mixer TX_CDC_DMA_TX_3_MMode1' 1"
	]
	DisableSequence [
		cset "name='VoiceMMode1_Tx Mixer TX_CDC_DMA_TX_3_MMode1' 0"
		cset "name='TX_DEC0 Volume' 84"
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='RX_CDC_DMA_RX_0_Voice Mixer VoiceMMode1' 0"
		cset "name='RX_CDC_DMA_RX_0 Audio Mixer MultiMedia5' 0"
		cset "name='HPHL_RDAC Switch' 0"
		cset "name='HPHR_RDAC Switch' 0"
		cset "name='HPHL_COMP Switch' 0"
		cset "name='HPHR_COMP Switch' 0"
		cset "name='RX_COMP1 Switch' 0"
		cset "name='RX_COMP2 Switch' 0"
	]
	Value {
		PlaybackPriority 400
		PlaybackPCM "stone_mm5"
		PlaybackChannels 2
		JackCTL "hw:StoneJack"
		JackControl "Headphone Jack"
	}
}

# USB headphones/headset, for calls. Media normally plays through
# PulseAudio's own USB card (snd-usb-audio); this device is the DSP route
# Android uses for calls (USB audio offload): the DSP plays on its
# USB_AUDIO_RX back end and the kernel's offload service (usb_audio_qmi)
# gives it the device's endpoint. /usr/lib/stone/usb-audio-jack.py (udev)
# writes USB_AUDIO_RX dev_token/format/rate/channels for the plugged device
# and sets "USB Jack"; stone-call-audio suspends PulseAudio's USB sink while
# this port is active, so the DSP can take the device. Lowest priority, so
# PulseAudio never moves sink.primary here on its own; telephony-service
# picks it for calls ("output-usb_device" in the patched handler).
# Uplink: the main mic (amic1), as for the earpiece.
SectionDevice."USB" {
	Comment "USB headphones"
	ConflictingDevice [
		"Speaker"
		"Earpiece"
		"Headphones"
		"Bluetooth"
	]
	EnableSequence [
		cset "name='USB_AUDIO_RX Audio Mixer MultiMedia5' 1"
		cset "name='USB_AUDIO_RX_Voice Mixer VoiceMMode1' 1"
		cset "name='TX_CDC_DMA_TX_3 Channels' One"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC0"
		cset "name='ADC1 ChMap' SWRM_TX1_CH1"
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_DEC0 Volume' 104"
		cset "name='VoiceMMode1_Tx Mixer TX_CDC_DMA_TX_3_MMode1' 1"
	]
	DisableSequence [
		cset "name='VoiceMMode1_Tx Mixer TX_CDC_DMA_TX_3_MMode1' 0"
		cset "name='TX_DEC0 Volume' 84"
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='USB_AUDIO_RX_Voice Mixer VoiceMMode1' 0"
		cset "name='USB_AUDIO_RX Audio Mixer MultiMedia5' 0"
	]
	Value {
		PlaybackPriority 10
		PlaybackPCM "stone_mm5"
		PlaybackChannels 2
		JackCTL "hw:StoneJack"
		JackControl "USB Jack"
	}
}

# Bluetooth SCO (HFP/HSP). The BT chip's SCO audio runs over SLIMbus
# (SLIMBUS_7, btfmslim), not over HCI. The SCO link itself is opened by
# PulseAudio's bluez module when sink.fake.sco/source.fake.sco are in use;
# stone-call-audio keeps source.fake.sco open while this port is active.
# 8 kHz: PulseAudio runs HFP with enable_msbc=false (CVSD narrowband).
SectionDevice."Bluetooth" {
	Comment "Bluetooth headset"
	ConflictingDevice [
		"Speaker"
		"Earpiece"
		"Headphones"
		"USB"
	]
	EnableSequence [
		cset "name='BT SampleRate' KHZ_8"
		cset "name='BT SampleRate RX' KHZ_8"
		cset "name='BT SampleRate TX' KHZ_8"
		# "low-latency-playback bt-sco" + "voicemmode1-call bt-sco"
		cset "name='SLIMBUS_7_RX Audio Mixer MultiMedia5' 1"
		cset "name='SLIM_7_RX_Voice Mixer VoiceMMode1' 1"
		cset "name='VoiceMMode1_Tx Mixer SLIM_7_TX_MMode1' 1"
	]
	DisableSequence [
		cset "name='VoiceMMode1_Tx Mixer SLIM_7_TX_MMode1' 0"
		cset "name='SLIM_7_RX_Voice Mixer VoiceMMode1' 0"
		cset "name='SLIMBUS_7_RX Audio Mixer MultiMedia5' 0"
	]
	Value {
		PlaybackPriority 50
		PlaybackPCM "stone_mm5"
		PlaybackChannels 2
	}
}

# Capture front end for recording apps (MultiMedia1). The mic chain itself
# is set by the active output device above.
SectionDevice."Mic" {
	Comment "Built-in microphone"
	ConflictingDevice [
		"Headset"
		"BluetoothMic"
		"USBMic"
	]
	EnableSequence [
		cset "name='MultiMedia1 Mixer TX_CDC_DMA_TX_3' 1"
	]
	DisableSequence [
		cset "name='MultiMedia1 Mixer TX_CDC_DMA_TX_3' 0"
	]
	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},0"
		CaptureChannels 1
	}
}

# Mic of a 4-pole 3.5 mm headset (vendor "headset-mic", amic2 = ADC2 input
# INP2). Same decimator and TX_CDC_DMA_TX_3 as the built-in mics, so both
# recording (MultiMedia1) and the call uplink (VoiceMMode1_Tx, connected by
# the Headphones output device) pick it up. Disabling it goes back to the
# main mic (amic1).
SectionDevice."Headset" {
	Comment "Headset microphone"
	ConflictingDevice [
		"Mic"
		"BluetoothMic"
		"USBMic"
	]
	EnableSequence [
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC4"
		cset "name='ADC2 ChMap' SWRM_TX2_CH1"
		cset "name='ADC2 MUX' INP2"
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='ADC2_MIXER Switch' 1"
		cset "name='MultiMedia1 Mixer TX_CDC_DMA_TX_3' 1"
	]
	DisableSequence [
		cset "name='MultiMedia1 Mixer TX_CDC_DMA_TX_3' 0"
		cset "name='ADC2_MIXER Switch' 0"
		cset "name='ADC2 MUX' INP3"
		cset "name='TX SMIC MUX0' SWR_MIC0"
		cset "name='ADC1_MIXER Switch' 1"
	]
	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},0"
		CaptureChannels 1
		JackCTL "hw:StoneJack"
		JackControl "Headset Mic Jack"
	}
}

# Mic of a USB headset, for calls (USB audio offload, like the USB output
# device): the DSP records USB_AUDIO_TX itself. /usr/lib/stone/
# usb-audio-jack.py writes USB_AUDIO_TX dev_token/format/rate/channels and
# sets "USB Mic Jack" only when the USB card that plays also has a capture
# stream (USB-C DAC dongles often have none). The output device (USB) has
# already connected the main mic to the uplink; this replaces it. Disabling
# only removes the USB uplink: telephony-service and PulseAudio switch the
# output port first, and every output device sets its own uplink.
# Lowest priority: recording apps keep the built-in mic unless chosen.
SectionDevice."USBMic" {
	Comment "USB headset microphone"
	ConflictingDevice [
		"Mic"
		"Headset"
		"BluetoothMic"
	]
	EnableSequence [
		cset "name='VoiceMMode1_Tx Mixer TX_CDC_DMA_TX_3_MMode1' 0"
		cset "name='VoiceMMode1_Tx Mixer USB_AUDIO_TX_MMode1' 1"
		cset "name='MultiMedia1 Mixer TX_CDC_DMA_TX_3' 0"
		cset "name='MultiMedia1 Mixer USB_AUDIO_TX' 1"
	]
	DisableSequence [
		cset "name='MultiMedia1 Mixer USB_AUDIO_TX' 0"
		cset "name='VoiceMMode1_Tx Mixer USB_AUDIO_TX_MMode1' 0"
	]
	Value {
		CapturePriority 10
		CapturePCM "hw:${CardId},0"
		CaptureChannels 1
		JackCTL "hw:StoneJack"
		JackControl "USB Mic Jack"
	}
}

SectionDevice."BluetoothMic" {
	Comment "Bluetooth headset microphone"
	ConflictingDevice [
		"Mic"
		"Headset"
		"USBMic"
	]
	EnableSequence [
		cset "name='MultiMedia1 Mixer SLIM_7_TX' 1"
	]
	DisableSequence [
		cset "name='MultiMedia1 Mixer SLIM_7_TX' 0"
	]
	Value {
		CapturePriority 50
		CapturePCM "hw:${CardId},0"
		CaptureChannels 1
	}
}
