Syntax 4

# The verb is called "Voice Call" (not "HiFi") because lomiri-telephony-service
# only follows headset plug/unplug during a call on the card whose profile has
# that name. It is the card's only verb; media uses it too.
SectionUseCase."Voice Call" {
	File "/stone/HiFi.conf"
	Comment "Calls and media"
}
