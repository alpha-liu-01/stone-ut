# libgbinder settings for Android 14 (Halium 14), given to sensorfwd only by
# etc/systemd/system/sensorfwd.service.d/zz-stone-gbinder.conf. API 34 uses
# libgbinder's API 33 preset: aidl3 RPC protocol and aidl3 service manager on
# /dev/binder. With the global default ("aidl"), servicemanager lists no
# services at all and sensorfwd waits forever for
# android.hardware.sensors.ISensors/default.
[General]
ApiLevel = 34
