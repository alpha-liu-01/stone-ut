# MVNO APN entries to prefer, one per line: MCC MNC MVNO_TYPE MATCH_DATA
# (mvno_type and mvno_match_data as in /usr/share/lineageos-apndb/apns-conf.xml).
# For each line, update-fixups.py keeps only that MVNO's entries for the
# MCC/MNC and drops the base carrier's, because ofono-sailfish cannot match
# MVNOs by IMSI or GID1 (ofono-apndb-plugin#2).
#
# This is the default the port was tested with. To use your own carrier,
# create /etc/stone/apndb-mvno.conf (an empty file means: no MVNO rules);
# this file is replaced on every boot, /etc/stone/apndb-mvno.conf is not.
# The change takes effect for a SIM that ofono provisions anew (a new SIM,
# or after resetting its contexts).
302 500 gid 55
