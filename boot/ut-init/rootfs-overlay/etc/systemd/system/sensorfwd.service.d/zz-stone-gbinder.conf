# The vendor sensors HAL is AIDL (android.hardware.sensors-service.xiaomi-multihal
# on /dev/binder). sensorfw's gbinder adaptor needs the Android 14 binder
# protocol for it; see /usr/share/stone/gbinder-api34.conf. Only sensorfwd
# gets it: a global ApiLevel would also let audiosystem-passthrough register
# media.audio_flinger, which camera_service's libaudioclient would then use.
[Unit]
After=lxc-android-config.service

[Service]
BindReadOnlyPaths=/usr/share/stone/gbinder-api34.conf:/etc/gbinder.conf
# repowerd waits for this unit (repowerd.service.d/zz-stone-sensorfw.conf).
# The HAL registers ~13 s into boot; do not hold repowerd for the default 90 s
# if it never does.
TimeoutStartSec=30
