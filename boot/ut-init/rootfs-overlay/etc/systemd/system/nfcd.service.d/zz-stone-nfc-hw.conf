# stone: run the NFC daemon only on units that have an NFC chip.
#
# The stone family shares one device tree and one vendor image: the
# st21nfc controller is described (i2c@4a80000, 0x08) and the vendor's
# android.hardware.nfc@1.2-service.st runs on every unit, but only some
# SKUs have the chip (sunstone_global and moonstone_p_global, per Xiaomi's
# commented-out check in drivers/nfc/st21nfc/st21nfc.c; e.g. sunstone_cn has
# none). Without this, nfcd's binder plugin publishes an adapter (/nfc0,
# "enabled", "powered") through the HAL anyway, and System Settings shows an
# NFC switch that does nothing.
#
# The kernel driver's probe resets the chip and waits for its NCI
# CORE_RESET_NTF (st21nfc_ping), so /dev/st21nfc only exists when a chip
# answered. The Qualcomm NQ nodes are accepted as well, for a variant with
# that controller (CONFIG_NFC_QTI_I2C is built too). See
# docs/roadmap-hardware-2.md, item 9.
[Unit]
ConditionPathExists=|/dev/st21nfc
ConditionPathExists=|/dev/nq-nci
ConditionPathExists=|/dev/nfc-nci
