# Temporary, while bringing up the modem: turn on ofono's DBG() output for
# the binder plugin and the QTI extension so the journal (readable by
# phablet) shows slot creation, IRadio connection and SIM status.
# ofonod-wrapper passes extra arguments through to ofonod.
[Service]
ExecStart=
ExecStart=/usr/libexec/lxc-android-config/ofonod-wrapper -d *binder*:*qti*:*sim*:*netreg*:*ims*
