# APN database with MVNO entries made the plain entries for their MCC/MNC
# (ofono-sailfish cannot match MVNOs by IMSI or GID1, ofono-apndb-plugin#2).
# Generated from the installed lineageos-apndb by update-fixups.py
# (stone-update-fixups.service, and after every dpkg run); the MVNO rules are
# in /etc/stone/apndb-mvno.conf, else /usr/share/stone/apndb-mvno.conf.
# ofonod-wrapper only sets its own default when this is empty. Provisioning
# only runs for a SIM ofono has no saved contexts for yet.
[Service]
Environment=OFONO_SYSTEM_APNDB_PATH=/usr/share/stone/apns-conf.xml
