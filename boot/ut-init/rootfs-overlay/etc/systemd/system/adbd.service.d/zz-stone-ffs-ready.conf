# adbd is Type=notify and reports ready before its USB thread has written the
# FunctionFS descriptors to /dev/usb-ffs/adb/ep0. usb-moded waits only for the
# start job (systemd_wait), then binds the UDC; when that comes first, the bind
# fails with ENODEV ("UDC: write failure: No such device") and usb-moded falls
# back to charging_only for the session: no adb, no MTP. Seen in boots that
# follow a charger-mode boot (docs/roadmap-release.md item 2).
#
# FunctionFS creates ep1/ep2 once the descriptors are written, which is when a
# bind can succeed. The start job completes only after ExecStartPost, so wait
# for ep1 here (at most 5 s; never fail the unit over it).
[Service]
ExecStartPost=/bin/sh -c 'i=0; while [ ! -e /dev/usb-ffs/adb/ep1 ] && [ $$i -lt 50 ]; do sleep 0.1; i=$$((i + 1)); done; exit 0'
