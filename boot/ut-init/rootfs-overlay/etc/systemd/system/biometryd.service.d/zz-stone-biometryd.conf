# stone: run biometryd main (0.4.1+) instead of the packaged 0.4.0, which
# aborts on every D-Bus request here (it reads the caller's AppArmor label
# with the removed GetConnectionAppArmorSecurityContext and asserts on the
# empty result). The build also talks to the fingerprint HAL directly over
# hwbinder (libgbinder), and falls back to the caller's AppArmor label by
# pid, because this kernel gives D-Bus no peer label. Only the daemon is
# replaced: clients keep the packaged libbiometry (same D-Bus protocol).
# Built by tools/biometryd/build.sh; see docs/roadmap-hardware-2.md item 8.
[Service]
Environment=LD_LIBRARY_PATH=/usr/lib/stone/biometryd
ExecStart=
ExecStart=/usr/lib/stone/biometryd/biometryd run
