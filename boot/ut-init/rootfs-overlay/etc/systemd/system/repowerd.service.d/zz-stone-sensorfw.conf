# repowerd creates its sensorfw light and proximity sensors once, at start.
# If sensorfwd is not up yet it falls back to null sensors for good: no
# screen-off at the ear during calls, no automatic brightness (and it spent
# ~20 s trying). sensorfwd is Type=notify and reports ready once the vendor
# sensors HAL answers (~14 s into boot); its start timeout is capped at 30 s
# in sensorfwd.service.d/zz-stone-gbinder.conf so this wait stays bounded.
[Unit]
Wants=sensorfwd.service
After=sensorfwd.service
