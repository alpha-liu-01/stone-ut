# The call audio output (earpiece/speaker/Bluetooth) is chosen by switching
# PulseAudio ports. This device's ports come from UCM ("[Out] Earpiece"),
# not from the droid card ("output-earpiece"); run the copy patched by
# tools/patch-telephony-ports.py (see the wrapper for why it is in /usr/bin).
[Service]
ExecStart=
ExecStart=/usr/lib/stone/telephony-service-handler.sh
