# Not read by ofono: ofonod-wrapper disables the socket "ril" plugin once
# device-info says OfonoPlugin=binder.
#
# audiosystem-passthrough (AUDIOSYSTEM_PASSTHROUGH_TYPE=qti) looks for
# [ril_N] groups with transport=binder:name=<slot> to know which
# vendor.qti.hardware.radio.am@1.0::IQcRilAudio/<slot> instances to serve.
# Without them it finds no slots and exits with status 2.
[ril_0]
transport = binder:name=slot1

[ril_1]
transport = binder:name=slot2
