# ofono-binder-plugin configuration for sunstone (crDroid 14 vendor).
#
# qcril registers two HIDL slots on /dev/hwbinder:
#   android.hardware.radio@1.5::IRadio/slot1, slot2
#   android.hardware.radio.config@1.1::IRadioConfig/default
#   vendor.qti.hardware.radio.ims@1.7::IImsRadio/imsradio0, imsradio1
# (persist.radio.multisim.config=dsds). The QTI extension, enabled in
# binder.d/qti.conf, maps slot N to imsradioN for VoLTE calls and SMS.

[Settings]
# List both slots so ofono doesn't start before qcril registers them.
ExpectSlots = slot1,slot2

# Every slot group needs a path, or binder_plugin_create_slot() drops the
# slot ("Missing path for slot slotN") and ofono has no modem at all. The
# slot numbers must be unique (the default is 0 for both). The QTI
# extension uses the slot number to pick imsradio<N>. /ril_0 and /ril_1
# are the modem paths Ubuntu Touch's telepathy-ofono and Settings expect.
[slot1]
path = /ril_0
slot = 0
# Without this the plugin uses IRadio 1.2 and drops NR from the
# technologies. qcril offers 1.5.
radioInterface = 1.5

[slot2]
path = /ril_1
slot = 1
radioInterface = 1.5
