# The kernel also registers dummy_udc.0 (CONFIG_USB_DUMMY_HCD), so the UDC
# cannot be taken from /sys/class/udc.
CONTROLLER=4e00000.dwc3

# No rescue mode. usb-moded.service passes -r by default: with a cable already
# plugged in when usb-moded starts, it then stays in developer_mode (RNDIS
# networking only, 10.15.19.82, no adb) until the cable is unplugged. That is
# a way into a port that does not boot; this one boots, and the recovery is
# the way in when it does not (docs/roadmap-release.md item 2).
USB_MODED_ARGS=
