# The vendor's WCNSS_qcom_cfg.ini has gEnableConcurrentSTA=wlan1, so qcacld
# creates a second station interface for Android's dual-STA feature. Managed
# by NetworkManager, wlan1 scans too, and every network shows up twice in the
# network indicator and System Settings. Ubuntu Touch uses one Wi-Fi
# interface (the hotspot also runs on wlan0); leave wlan1 alone.
# See docs/roadmap-hardware-2.md, Wi-Fi network list.
[keyfile]
unmanaged-devices=interface-name:wlan1
