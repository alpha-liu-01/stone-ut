# MultiMedia5, the low-latency front end the vendor HAL plays system sounds
# and media on. Wrapped in a pass-through "hooks" PCM (still mmap, no copy):
# PulseAudio only rewinds raw hw PCMs, and msm-pcm-q6 hands every queued
# period to the DSP at once, so rewound audio is never replayed. With the
# wrapper PulseAudio disables rewinds for this sink (see item 3 in
# docs/roadmap-hardware.md). Used by the UCM profile in /usr/share/stone/ucm2.
pcm.stone_mm5 {
	type hooks
	slave.pcm "hw:holiqrdsku1sndc,9"
	hint.description "Xiaomi stone MultiMedia5"
}
