# udisks mount options for the microSD slot (and USB-OTG sticks).
#
# udisks' built-in vfat defaults end in "flush". With it, the kernel's
# fat_file_release() writes the file out and then sleeps HZ/10 on every
# close() of a file opened for writing: a fixed 100 ms per file. On this
# phone 200 x 64 KB files took 20.3 s on the FAT32 card (internal ext4:
# 0.2 s), so copying a folder of photos or music, by MTP or a file manager,
# spends most of its time sleeping. Android's vold mounts FAT cards without
# it. Without "flush", dirty data goes out with normal writeback (about 30 s),
# so unmount/eject before pulling the card, as on Android.
#
# Everything else is udisks 2.10's built-in vfat default.
[defaults]
vfat_defaults=uid=$UID,gid=$GID,shortname=mixed,utf8=1,showexec
